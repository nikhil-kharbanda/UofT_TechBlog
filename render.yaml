services:
  - type: web
    name: uoft-techblog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techblog-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: techblog-db
    plan: free
    databaseName: techblogdb
