services:
  - type: web
    name: uoft-techblog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Aiven MySQL Service URI (without the ?ssl-mode=REQUIRED suffix)
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
